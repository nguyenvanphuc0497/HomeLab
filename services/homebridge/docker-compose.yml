services:
  homebridge:
    image: homebridge/homebridge:latest
    container_name: homebridge
    restart: unless-stopped

    # REQUIRED: Host network mode for HomeKit mDNS discovery
    network_mode: host

    hostname: homebridge

    environment:
      # Timezone
      - TZ=${TZ:-UTC}

      # Enable Avahi for mDNS (HomeKit discovery)
      - ENABLE_AVAHI=1

    volumes:
      # Homebridge config and plugins
      - ./data:/homebridge

    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '1'

    healthcheck:
      test: [ "CMD-SHELL", "curl --fail http://localhost:8581 || exit 1" ]
      interval: 60s
      retries: 5
      start_period: 300s
      timeout: 2s
