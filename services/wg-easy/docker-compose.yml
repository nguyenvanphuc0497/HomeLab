name: wg-easy

services:
  wg-easy:
    image: ghcr.io/wg-easy/wg-easy:15.2
    container_name: wg-easy
    restart: unless-stopped

    environment:
      - PORT=51821
      - INSECURE=true
      - TZ=${TZ}

    networks:
      wg:
        ipv4_address: 10.43.43.42
        ipv6_address: fdcc:ad94:bacf:61a4::2a

    volumes:
      # Persistent storage for WireGuard configuration
      - wireguard_data:/etc/wireguard
      # Required for kernel module loading
      - /lib/modules:/lib/modules:ro

    ports:
      # WireGuard VPN port (UDP)
      - "51820:51820/udp"
      # Web UI port (TCP)
      - "51821:51821/tcp"

    cap_add:
      - NET_ADMIN
      - SYS_MODULE
      # - NET_RAW  # ⚠️ Uncomment if using Podman

    sysctls:
      # IPv4 forwarding
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
      # IPv6 support
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
      - net.ipv6.conf.default.forwarding=1

networks:
  wg:
    driver: bridge
    enable_ipv6: true
    ipam:
      driver: default
      config:
        - subnet: 10.43.43.0/24
        - subnet: fdcc:ad94:bacf:61a4::/64

volumes:
  wireguard_data:
